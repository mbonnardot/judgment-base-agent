[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "judgment-base-agent"
version = "0.1.0"
description = "Model-agnostic System One / Calibrated Judgment primitives for Google ADK workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # [eval] pulls pandas, which google.adk.evaluation imports at module load.
    # judgment_base_agent/__init__.py imports evals.py, so the bare extra-less
    # google-adk makes `import judgment_base_agent` fail outright.
    "google-adk[eval]>=2.7.0",
    "typesafe-sdk>=0.2.0",
    "pydantic>=2.7.0",
    # Imported directly by backends/diffusiongemma.py and the examples; they
    # arrive transitively via google-adk today, but that is not a contract.
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

# PEP 735 group so `uv sync` installs the dev tooling by default.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    # Pinned exactly: ruff's default rule set moves between releases, and an
    # exact pin also keeps the binary hash stable for endpoint allowlisting.
    "ruff==0.16.8",
]

# Pin resolution to public PyPI so the lockfile is reproducible off any
# machine. Without this, uv falls back to whatever default index is set in
# machine-level config (for example a corporate mirror configured in
# /etc/uv/uv.toml), and bakes that host's artifact URLs into uv.lock --
# which then fails to install anywhere else, CI included.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.setuptools.packages.find]
include = ["judgment_base_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "heavy: needs torch/transformers and downloads a model from Hugging Face; run with `pytest -m heavy`",
]

[tool.ruff]
# 31 lines exceed 120 today; E501 is deliberately not selected below, so this
# only guides `ruff format` (which this project does not currently run).
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly rather than inheriting ruff's defaults: as of 0.16 those
# defaults span YTT/ASYNC/S/B/C4/I/UP/PL/RUF, and they have moved before. An
# explicit list keeps `ruff check` reproducible across ruff versions.
select = [
    "E4",       # pycodestyle: import placement
    "E7",       # pycodestyle: statement-level errors
    "E9",       # pycodestyle: syntax / IO errors
    "F",        # pyflakes -- catches the undefined-name class of bug
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "I",        # isort
    "RUF",      # ruff-specific
    "PLR0124",  # comparison-with-itself; caught a dead assertion in this repo
]

ignore = [
    # This project renders em-dashes and other typographic punctuation into
    # user-facing markdown on purpose; RUF001-003 only flag that prose.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Each example deliberately inserts the repo root into sys.path before
# importing judgment_base_agent, so a source checkout works uninstalled.
"examples/*/agent.py" = ["E402"]

[tool.ruff.lint.isort]
# Matches the existing Google-style ordering: `import x` and `from x import y`
# interleaved alphabetically within a section rather than grouped by form.
force-sort-within-sections = true
known-first-party = ["judgment_base_agent", "examples", "benchmarks"]

